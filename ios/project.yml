name: LiveSub
options:
  bundleIdPrefix: com.martinfournier
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: "73GKXRXN2G"
    CODE_SIGN_STYLE: Automatic

targets:
  LiveSub:
    type: application
    platform: iOS
    sources:
      - path: LiveSub
      - path: Shared
    info:
      path: LiveSub/Resources/Info.plist
      properties:
        CFBundleDisplayName: "LiveSub"
        NSSpeechRecognitionUsageDescription: "LiveSub requires speech recognition to transcribe audio into subtitles in real-time on your device."
        NSMicrophoneUsageDescription: "LiveSub requires microphone access for audio input fallback."
        UIBackgroundModes:
          - audio
    entitlements:
      path: LiveSub/LiveSub.entitlements
    dependencies:
      - target: LiveSubBroadcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martinfournier.livesub
        INFOPLIST_FILE: LiveSub/Resources/Info.plist

  LiveSubBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveSubBroadcast
      - path: Shared
    info:
      path: LiveSubBroadcast/Info.plist
      properties:
        CFBundleDisplayName: "LiveSub Broadcast"
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.broadcast-services-upload"
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
          RPBroadcastProcessMode: "RPBroadcastProcessModeSampleBuffer"
    entitlements:
      path: LiveSubBroadcast/LiveSubBroadcast.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martinfournier.livesub.LiveSubBroadcast
        INFOPLIST_FILE: LiveSubBroadcast/Info.plist
